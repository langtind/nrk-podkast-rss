name: update feeds

on:
  schedule:
    # Inkrementell: ett katalog-kall per serie, ~235 kall.
    - cron: "*/15 * * * *"
    # Full crawl mandag natt — eneste måten å oppdage at NRK har fjernet
    # en episode. Skjevt klokkeslett; runde tider er mest overbooket.
    - cron: "43 3 * * 1"
  workflow_dispatch:
    inputs:
      series:
        description: "Komma-separert delmengde (tomt = alle)"
        required: false
        default: ""
      full:
        description: "Full crawl av alle sider"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bygg feeder
        id: build
        run: |
          FULL=""
          if [ "${{ github.event.schedule }}" = "43 3 * * 1" ] \
             || [ "${{ inputs.full }}" = "true" ]; then
            FULL="--full"
          fi
          python build.py \
            --base-url "${BASE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}" \
            --series "${{ inputs.series }}" \
            --workers 12 \
            --out site $FULL
        env:
          BASE_URL: ${{ vars.BASE_URL }}

      - name: Commit cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache
          if git diff --quiet --cached; then
            echo "ingen cache-endringer"
            exit 0
          fi
          git commit -m "chore: refresh episode cache"
          # Kjøringer serialiseres av concurrency-gruppa, men en manuell
          # dispatch kan likevel ha flyttet remote under oss.
          git pull --rebase --autostash -q origin main || true
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # Planlagte kjøringer uten endringer produserer identisk HTML — ikke bruk
    # et Pages-bygg på det. Manuelle kjøringer deployer alltid, siden de som
    # regel kommer etter en kodeendring.
    if: github.event_name != 'schedule' || needs.build.outputs.changed != '0'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
